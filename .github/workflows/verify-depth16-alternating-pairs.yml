name: Validate confirmed alternating Camera2 captures
on:
  push:
    branches: [research/s20-depth16-confirmed-alternating-pairs]
  pull_request:
    branches: [research/s20-depth16-four-capture-pairing-audit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  confirmed-pair-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependencies
        run: python -m pip install numpy opencv-python-headless
      - name: Test user-confirmed paired direction and no fabricated grade
        run: python -m unittest discover -s research/sc52a_rgb_multiview -p 'test_score_confirmed_alternating_pairs.py' -v
      - name: Test unknown-label handling (regression)
        run: python -m unittest discover -s research/sc52a_rgb_multiview -p 'test_audit_four_depth16_capture_pairings.py' -v
      - name: Verify physical accuracy remains explicitly uncertified
        run: |
          grep -q '"commercial_putting_accuracy_certified":False' research/sc52a_rgb_multiview/score_confirmed_alternating_pairs.py
          grep -q 'target_region_independently_identified' research/sc52a_rgb_multiview/score_confirmed_alternating_pairs.py
