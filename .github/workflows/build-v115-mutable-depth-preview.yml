name: Build Green Reader v11.5 mutable depth preview hotfix
on:
  push:
    branches: [fix/s20-v115-mutable-depth-preview-bitmap]
  pull_request:
    branches: [research/s20-v114-native-depth-guides-and-version-provenance]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-v115-preview-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate v11.5 Android mutable preview sources
        run: python3 scripts/build_precision_v115_mutable_depth_preview.py
      - name: Prevent immutable bitmap regression and verify capture invariants
        run: python3 scripts/verify_precision_v115_preview_mutability.py
      - name: Run offline depth candidate and camera motion synthetic tests
        run: |
          python3 -m unittest discover -s research/sc52a_rgb_multiview -p 'test_audit_paired_elevated_board.py' -v
          python3 -m unittest discover -s research/sc52a_rgb_multiview -p 'test_audit_depth16_imu_stability.py' -v
          python3 -m unittest discover -s research/sc52a_rgb_multiview -p 'test_render_private_depth_annotation.py' -v
      - name: Prepare upgrade-compatible research signer
        run: python3 scripts/prepare_existing_signing_v73.py
      - name: Compile Android and run JVM unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify version, package and original APK certificate
        run: |
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/v115.badging
          grep -q "versionCode='1150'" /tmp/v115.badging
          grep -q "name='jp.showchoo.greenreader.precision'" /tmp/v115.badging
          CERT="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test "$CERT" = "2c06a12144ece069f117dc495c49a15e14108e61167ac9befddbfd4c60919fa0"
          cp "$APK" GreenReaderPrecision-v115-MutableDepthPreview-compatible.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GreenReaderPrecision-v115-MutableDepthPreview-compatible
          path: GreenReaderPrecision-v115-MutableDepthPreview-compatible.apk
          if-no-files-found: error
