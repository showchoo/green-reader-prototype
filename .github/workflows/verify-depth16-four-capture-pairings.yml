name: Audit S20 DEPTH16 capture pairing uncertainty
on:
  push:
    branches: [research/s20-depth16-four-capture-pairing-audit]
  pull_request:
    branches: [research/s20-depth16-background-reference-qc]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numeric analysis dependencies
        run: python -m pip install numpy opencv-python-headless
      - name: Test uncertain pairing and camera posture guards
        run: python -m unittest discover -s research/sc52a_rgb_multiview -p 'test_audit_four_depth16_capture_pairings.py' -v
      - name: Preserve model geometry regression
        run: python -m unittest discover -s research/sc52a_rgb_multiview -p 'test_compare_depth_geometry_models.py' -v
      - name: Verify no implicit physical accuracy PASS
        run: |
          grep -q '"commercial_putting_accuracy_certified":False' research/sc52a_rgb_multiview/audit_four_depth16_capture_pairings.py
          grep -q 'time_proximity_is_not_ground_truth_condition' research/sc52a_rgb_multiview/audit_four_depth16_capture_pairings.py
