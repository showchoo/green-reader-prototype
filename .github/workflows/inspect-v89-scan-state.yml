name: Inspect Green Reader scan retry state v8.9
on:
  push:
    branches: [chatgpt-v89-tracking-retry-recovery]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Generate v8.8 source
        run: python3 scripts/build_precision_v88.py
      - name: Print generated scan control excerpts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/java/jp/example/greenreader/MainActivity.kt').read_text()
          lines=s.splitlines()
          needles=['位置追跡を準備中','private fun toggleScan','private fun recordPrecisionScanFailure','private fun finishPrecision','private fun startPrecision','scanButton.isEnabled = false','if (scanning) {','private fun stopScan','private fun tryResolvePendingMark']
          done=set()
          for word in needles:
              hits=[i for i,ln in enumerate(lines) if word in ln]
              print('DEBUG_KEY',word,'HITS',len(hits))
              for i in hits[:7]:
                  lo=max(0,i-12)
                  hi=min(len(lines),i+65 if 'private fun' in word else i+26)
                  if (lo,hi) in done: continue
                  done.add((lo,hi))
                  print('DEBUG_BEGIN',word,'LINE',i+1)
                  for j in range(lo,hi): print(f'{j+1:5d}: {lines[j]}')
                  print('DEBUG_END',word)
          PY
