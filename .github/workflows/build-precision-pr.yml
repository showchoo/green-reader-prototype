name: Build Green Reader Precision Direct UI APK

on:
  pull_request:
    branches: [ precision-build-base ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore and verify source bundle
        shell: bash
        run: |
          cat precision-ui2/part00 precision-ui2/part01 precision-ui2/part02 precision-ui2/part03 precision-ui2/part04 precision-ui2/part05 precision-ui2/part06 precision-ui2/part07 | tr -d '\n\r' | base64 -d > precision-v1.1.zip
          echo "a9d62a5e23da459cd1a021cd2332b6ec6d4d00f096b36af092c50b4bf69f4f1c  precision-v1.1.zip" | sha256sum -c -
          unzip -q precision-v1.1.zip
          test -f green-reader-v1/settings.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run tests and build APK
        working-directory: green-reader-v1
        run: |
          gradle testDebugUnitTest :app:assembleDebug

      - name: Rename APK
        run: cp green-reader-v1/app/build/outputs/apk/debug/app-debug.apk GreenReaderPrecision-v1.1-direct-ui.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GreenReaderPrecision-v1.1-direct-ui
          path: GreenReaderPrecision-v1.1-direct-ui.apk
          if-no-files-found: error
