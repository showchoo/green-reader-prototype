name: Build Green Reader Precision v6.7

on:
  pull_request:
    branches: [ precision-build-base ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply all proven v0.8.19 improvements
        shell: bash
        run: |
          python3 scripts/apply_power_saving.py
          python3 scripts/apply_v070_ui.py
          python3 scripts/apply_v072_clean_result.py
          python3 scripts/apply_v073_no_stimp.py
          python3 scripts/apply_v074_auto_grain.py
          python3 scripts/apply_v075_full_auto_log.py
          python3 scripts/apply_v078_screen_cross.py
          python3 scripts/apply_v079_bottom_inset.py
          python3 scripts/apply_v080_depth_first_marks.py
          python3 scripts/apply_v081_anchor_local_frame.py
          python3 scripts/apply_v082_auto_mark_sequence.py
          python3 scripts/apply_v083_open_saved_data.py
          python3 scripts/apply_v084_data_manager.py
          python3 scripts/apply_v087_anchor_cross_projection.py
          python3 scripts/apply_v0812_consensus_scan.py
          python3 scripts/apply_v0818_known_good_geometry.py
          python3 scripts/apply_v0819_ball_center_depth_fallback.py

      - name: Apply Precision v6.7
        run: |
          python3 scripts/apply_precision_v12_integrated.py
          python3 scripts/fix_precision_v12_3d_feed.py
          python3 scripts/apply_precision_v14_gravity_frame.py
          python3 scripts/apply_precision_v15_ground_extraction.py
          python3 scripts/apply_precision_v16_fail_closed.py
          python3 scripts/apply_precision_v17_relaxed_diagnostics.py
          python3 scripts/apply_precision_v18_persistent_diagnostics.py
          python3 scripts/apply_precision_v19_gmail_auto_report.py
          python3 scripts/apply_precision_v20_oauth_signing.py
          python3 scripts/apply_precision_v21_remove_gmail.py
          python3 scripts/apply_precision_v22_failure_dialog.py
          python3 scripts/apply_precision_v23_detailed_diagnostics.py
          python3 scripts/apply_precision_v24_runtime_tuning.py
          python3 scripts/apply_precision_v25_depth_aligned_marks.py
          python3 scripts/apply_precision_v26_putt_corridor.py
          python3 scripts/apply_precision_v27_aggregate_final.py
          python3 scripts/apply_precision_v28_align_ball_depth.py
          python3 scripts/apply_precision_v29_surface_first_marks.py
          python3 scripts/apply_precision_v30_marker_sanity.py
          python3 scripts/apply_precision_v31_copy_fix.py
          python3 scripts/apply_precision_v32_immediate_mark_validation.py
          python3 scripts/apply_precision_v33_cup_depth_fallback.py
          python3 scripts/apply_precision_v34_full_depth_image_intrinsics.py
          python3 scripts/apply_precision_v35_marker_pipeline.py
          python3 scripts/apply_precision_v36_candidate_validation.py
          python3 scripts/apply_precision_v37_fresh_frame_depth.py
          python3 scripts/apply_precision_v38_long_range_cup_gate.py
          python3 scripts/apply_precision_v39_dynamic_scan_depth.py
          python3 scripts/apply_precision_v40_long_scan_full_supplement.py
          python3 scripts/apply_precision_v41_restore_slope_analyzer.py
          python3 scripts/apply_precision_v42_field_failure_ux.py
          python3 scripts/apply_precision_v43_idle_power_saving.py
          python3 scripts/apply_precision_v44_complete_field_logging.py
          python3 scripts/apply_precision_v45_neon_hud_ui.py
          python3 scripts/apply_precision_v46_ar_startup_stability.py
          python3 scripts/apply_precision_v47_collapsible_controls.py
          python3 scripts/verify_precision_marker_pipeline.py

      - name: Upload generated source for audit
        uses: actions/upload-artifact@v4
        with:
          name: GreenReaderPrecision-v6.7-generated-source
          path: app/src/main/java/jp/example/greenreader/MainActivity.kt
          retention-days: 90

      - name: Prepare fixed signing key
        shell: bash
        env:
          GREEN_READER_KEYSTORE_B64: ${{ secrets.GREEN_READER_KEYSTORE_B64 }}
          GREEN_READER_STORE_PASSWORD_SECRET: ${{ secrets.GREEN_READER_STORE_PASSWORD }}
          GREEN_READER_KEY_ALIAS_SECRET: ${{ secrets.GREEN_READER_KEY_ALIAS }}
          GREEN_READER_KEY_PASSWORD_SECRET: ${{ secrets.GREEN_READER_KEY_PASSWORD }}
        run: |
          if [ -n "$GREEN_READER_KEYSTORE_B64" ]; then
            echo "$GREEN_READER_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/greenreader-release.jks"
            echo "GREEN_READER_KEYSTORE_PATH=$RUNNER_TEMP/greenreader-release.jks" >> "$GITHUB_ENV"
            echo "GREEN_READER_STORE_PASSWORD=$GREEN_READER_STORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "GREEN_READER_KEY_ALIAS=$GREEN_READER_KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
            echo "GREEN_READER_KEY_PASSWORD=$GREEN_READER_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
          else
            echo "Using repository fixed debug signing key"
            base64 --decode scripts/precision-debug-keystore.b64 > "$RUNNER_TEMP/greenreader-release.jks"
            echo "GREEN_READER_KEYSTORE_PATH=$RUNNER_TEMP/greenreader-release.jks" >> "$GITHUB_ENV"
            echo "GREEN_READER_STORE_PASSWORD=greenreader" >> "$GITHUB_ENV"
            echo "GREEN_READER_KEY_ALIAS=greenreader-debug" >> "$GITHUB_ENV"
            echo "GREEN_READER_KEY_PASSWORD=greenreader" >> "$GITHUB_ENV"
          fi

      - name: Run tests and build APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Rename APK
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" GreenReaderPrecision-v6.7-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GreenReaderPrecision-v6.7-debug
          path: GreenReaderPrecision-v6.7-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK for direct download
        shell: bash
        run: |
          APK="$PWD/GreenReaderPrecision-v6.7-debug.apk"
          cp "$APK" "$RUNNER_TEMP/GreenReaderPrecision-v6.7-debug.apk"
          git fetch origin apk-downloads
          git reset --hard
          git clean -fd
          git checkout -B apk-downloads origin/apk-downloads
          mkdir -p downloads
          cp "$RUNNER_TEMP/GreenReaderPrecision-v6.7-debug.apk" downloads/GreenReaderPrecision-v6.7-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/GreenReaderPrecision-v6.7-debug.apk
          git commit -m "Publish Green Reader Precision v6.7 APK" || true
          git push origin HEAD:apk-downloads
