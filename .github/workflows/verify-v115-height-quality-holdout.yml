name: Verify independent height holdout and quality gates
on:
  push:
    branches: [research/s20-v115-height-quality-and-holdout-gates]
  pull_request:
    branches: [research/s20-v115-plane-normal-height-comparison]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  height-quality-holdouts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research-only numeric dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Verify height holdout, pose and floor-quality gate regression
        run: python -m unittest discover -s research/sc52a_rgb_multiview -p 'test_audit_height_quality_gates.py' -v
      - name: Verify parent plane-normal and depth safety tests
        run: |
          python -m unittest discover -s research/sc52a_rgb_multiview -p 'test_estimate_relative_board_height.py' -v
          python -m unittest discover -s research/sc52a_rgb_multiview -p 'test_audit_paired_elevated_board.py' -v
          python -m unittest discover -s research/sc52a_rgb_multiview -p 'test_audit_depth16_imu_stability.py' -v
      - name: Compile audit code
        run: python -m py_compile research/sc52a_rgb_multiview/audit_height_quality_gates.py
