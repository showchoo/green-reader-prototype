name: Verify Green Reader v10.0
on:
  push:
    branches: [chatgpt-v100-sparse-raw-fallback]
  pull_request:
    branches: [chatgpt-v99-anchored-ground-selection]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate source
        run: python3 scripts/build_precision_v100.py
      - name: Offline geometry regression tests
        run: python3 -m unittest discover -s scripts -p 'test_analyze_precision_view_geometry.py' -v
      - name: Session consistency regression tests
        run: python3 -m unittest discover -s scripts -p 'test_analyze_precision_session_consistency.py' -v
      - name: Set up original upgrade-compatible signing
        run: python3 scripts/prepare_existing_signing_v73.py
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify package and certificate
        run: |
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "versionCode='1000'"
          CERT="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test "$CERT" = "2c06a12144ece069f117dc495c49a15e14108e61167ac9befddbfd4c60919fa0"
          cp "$APK" GreenReaderPrecision-v10.0-v69-compatible.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GreenReaderPrecision-v10.0-v69-compatible-apk
          path: GreenReaderPrecision-v10.0-v69-compatible.apk
          if-no-files-found: error
