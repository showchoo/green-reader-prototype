name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: green-reader-debug-keystore-v1

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Apply power-saving patch
        run: python3 scripts/apply_power_saving.py

      - name: Apply v0.7 scan UI refresh
        run: python3 scripts/apply_v070_ui.py

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GreenReaderPrototype-v0.7-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GreenReaderPrototype-v0.7-debug-apk
          path: GreenReaderPrototype-v0.7-debug.apk
          if-no-files-found: error
          retention-days: 30
