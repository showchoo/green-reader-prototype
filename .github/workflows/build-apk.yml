name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: green-reader-debug-keystore-v1

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Apply power-saving patch
        run: python3 scripts/apply_power_saving.py

      - name: Apply Japanese scan UI
        run: python3 scripts/apply_v070_ui.py

      - name: Apply clean result UI
        run: python3 scripts/apply_v072_clean_result.py

      - name: Remove green-speed control
        run: python3 scripts/apply_v073_no_stimp.py

      - name: Enable automatic grain logging
        run: python3 scripts/apply_v074_auto_grain.py

      - name: Enable complete automatic scan logging
        run: python3 scripts/apply_v075_full_auto_log.py

      - name: Fix screen-space downhill direction
        run: python3 scripts/apply_v078_screen_cross.py

      - name: Lift controls above navigation bar
        run: python3 scripts/apply_v079_bottom_inset.py

      - name: Prefer depth for ball and cup marks
        run: python3 scripts/apply_v080_depth_first_marks.py

      - name: Keep multi-frame depth in ball Anchor coordinates
        run: python3 scripts/apply_v081_anchor_local_frame.py

      - name: Use automatic Ball-to-Cup tap sequence
        run: python3 scripts/apply_v082_auto_mark_sequence.py

      - name: Add saved-data folder link
        run: python3 scripts/apply_v083_open_saved_data.py

      - name: Open saved-data manager
        run: python3 scripts/apply_v084_data_manager.py

      - name: Keep displayed cross axis in the same Anchor frame
        run: python3 scripts/apply_v087_anchor_cross_projection.py

      - name: Use five-window consensus scanning
        run: python3 scripts/apply_v0812_consensus_scan.py

      - name: Restore known-good geometry and single-shot taps
        run: python3 scripts/apply_v0818_known_good_geometry.py

      - name: Build debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GreenReaderPrototype-v0.8.18-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GreenReaderPrototype-v0.8.18-debug-apk
          path: GreenReaderPrototype-v0.8.18-debug.apk
          if-no-files-found: error
          retention-days: 30
