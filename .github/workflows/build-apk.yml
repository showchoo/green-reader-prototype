name: Build Green Reader Precision v7.1

on:
  workflow_dispatch:
  push:
    branches:
      - "chatgpt-v71-auto-field-recording"
  pull_request:
    branches:
      - "chatgpt-v70-session-quality"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Precision v7.1 source
        run: python3 scripts/build_precision_v71.py

      - name: Prepare v6.9-compatible signing key
        shell: bash
        run: |
          base64 --decode scripts/precision-debug-keystore.b64 > "$RUNNER_TEMP/greenreader-release.jks"
          echo "GREEN_READER_KEYSTORE_PATH=$RUNNER_TEMP/greenreader-release.jks" >> "$GITHUB_ENV"
          echo "GREEN_READER_STORE_PASSWORD=greenreader" >> "$GITHUB_ENV"
          echo "GREEN_READER_KEY_ALIAS=greenreader-debug" >> "$GITHUB_ENV"
          echo "GREEN_READER_KEY_PASSWORD=greenreader" >> "$GITHUB_ENV"

      - name: Run unit tests and build APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify v6.9 signing certificate
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$APK"
          CERT="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          echo "APK signing certificate SHA-256: $CERT"
          test "$CERT" = "2c06a12144ece069f117dc495c49a15e14108e61167ac9befddbfd4c60919fa0"
          cp "$APK" GreenReaderPrecision-v7.0-v69-compatible.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GreenReaderPrecision-v7.0-v69-compatible-apk
          path: GreenReaderPrecision-v7.0-v69-compatible.apk
          if-no-files-found: error
          retention-days: 30
