name: Verify v11.3 paired empty-floor board difference research
on:
  push:
    branches: [research/s20-v113-paired-board-difference-audit]
  pull_request:
    branches: [fix/v113-record-button-always-visible]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-paired-board:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify paired-board synthetic agreement and fail-closed diagnostics
        run: python3 -m unittest discover -s research/sc52a_rgb_multiview -p 'test_audit_paired_elevated_board.py' -v
      - name: Preserve previous offline depth and IMU research
        run: |
          python3 -m unittest discover -s research/sc52a_rgb_multiview -p 'test_audit_depth16_imu_stability.py' -v
          python3 -m unittest discover -s research/sc52a_rgb_multiview -p 'test_audit_depth16_confidence_stability.py' -v
          python3 -m unittest discover -s research/sc52a_rgb_multiview -p 'test_audit_depth16_surface_identifiability.py' -v
      - name: Compile audit source
        run: python3 -m py_compile research/sc52a_rgb_multiview/audit_paired_elevated_board.py
