name: Verify research floor-normal height estimate (not calibrated)
on:
  push:
    branches: [research/s20-v115-plane-normal-height-comparison]
  pull_request:
    branches: [fix/s20-v115-mutable-depth-preview-bitmap]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-relative-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated research numerical dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Test uncalibrated projected height with synthetic tilt and occlusion
        run: python -m unittest discover -s research/sc52a_rgb_multiview -p 'test_estimate_relative_board_height.py' -v
      - name: Verify existing DEPTH16, IMU and contour safety gates
        run: |
          python -m unittest discover -s research/sc52a_rgb_multiview -p 'test_audit_paired_elevated_board.py' -v
          python -m unittest discover -s research/sc52a_rgb_multiview -p 'test_audit_depth16_imu_stability.py' -v
      - name: Compile research module
        run: python -m py_compile research/sc52a_rgb_multiview/estimate_relative_board_height.py
