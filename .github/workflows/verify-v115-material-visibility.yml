name: Verify raised material depth visibility (research only)
on:
  push:
    branches: [research/s20-v115-translucent-material-depth-visibility]
  pull_request:
    branches: [research/s20-v115-single-view-surface-bias-checks]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  material-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated depth analysis dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Test synthetic opaque and unresolved depth response
        run: python -m unittest discover -s research/sc52a_rgb_multiview -p 'test_audit_material_depth_visibility.py' -v
      - name: Check existing plane, curvature and IMU safeguards
        run: |
          python -m unittest discover -s research/sc52a_rgb_multiview -p 'test_audit_single_view_local_surface.py' -v
          python -m unittest discover -s research/sc52a_rgb_multiview -p 'test_audit_height_quality_gates.py' -v
          python -m unittest discover -s research/sc52a_rgb_multiview -p 'test_audit_paired_elevated_board.py' -v
      - name: Verify module compiles
        run: python -m py_compile research/sc52a_rgb_multiview/audit_material_depth_visibility.py
