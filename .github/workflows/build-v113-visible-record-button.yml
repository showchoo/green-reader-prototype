name: Build Green Reader v11.3 always-visible record button
on:
  push:
    branches: [fix/v113-record-button-always-visible]
  pull_request:
    branches: [research/s20-v112-live-depth-preview]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-v113-visible-button:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate v11.3 research APK with safe viewport layout
        run: python3 scripts/build_precision_v113_visible_record_button.py
      - name: Verify layout, depth capture and backup invariants
        run: python3 scripts/verify_precision_v113_visible_record_button.py
      - name: Run offline synthetic depth/regression tests
        run: |
          python3 -m unittest discover -s research/sc52a_rgb_multiview -p 'test_render_private_depth_annotation.py' -v
          python3 -m unittest discover -s research/sc52a_rgb_multiview -p 'test_audit_annotated_board_roi.py' -v
          python3 -m unittest discover -s research/sc52a_rgb_multiview -p 'test_audit_depth16_confidence_stability.py' -v
      - name: Restore v11.1-compatible APK signer
        run: python3 scripts/prepare_existing_signing_v73.py
      - name: Compile and unit-test Android sources
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Validate version, package name and existing signer
        run: |
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/v113.badging
          grep -q "versionCode='1130'" /tmp/v113.badging
          grep -q "name='jp.showchoo.greenreader.precision'" /tmp/v113.badging
          CERT="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test "$CERT" = "2c06a12144ece069f117dc495c49a15e14108e61167ac9befddbfd4c60919fa0"
          cp "$APK" GreenReaderPrecision-v113-VisibleRecordButton-compatible.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GreenReaderPrecision-v113-VisibleRecordButton-compatible
          path: GreenReaderPrecision-v113-VisibleRecordButton-compatible.apk
          if-no-files-found: error
